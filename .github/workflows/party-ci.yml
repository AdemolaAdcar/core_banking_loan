name: Party CI

on:
  push:
    branches: [main]
    paths:
      - "services/party/**"
      - "specs/openapi/party-cif.yaml"
      - "specs/asyncapi/party-events.yaml"
      - "specs/schemas/party.schema.json"
      - ".github/workflows/party-ci.yml"
  pull_request:
    paths:
      - "services/party/**"
      - "specs/openapi/party-cif.yaml"
      - "specs/asyncapi/party-events.yaml"
      - "specs/schemas/party.schema.json"
      - ".github/workflows/party-ci.yml"

defaults:
  run:
    working-directory: services/party

# golang-migrate CLI version pinned for reproducibility -- bump
# deliberately, not via @latest, so CI doesn't silently pick up a new
# major version's breaking CLI changes.
env:
  MIGRATE_VERSION: v4.19.1

jobs:
  build-test:
    name: Build, vet, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/party/go.mod
          cache-dependency-path: services/party/go.sum
      - run: go build ./...
      - run: go vet ./...
      - name: gofmt check
        run: |
          fmt_out="$(gofmt -l .)"
          if [ -n "$fmt_out" ]; then
            echo "The following files are not gofmt-formatted:"
            echo "$fmt_out"
            exit 1
          fi
      - run: go test ./... -v

  migrations:
    name: Migration runner (up / down / up)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: party
          POSTGRES_PASSWORD: party
          POSTGRES_DB: party
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://party:party@localhost:5432/party?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/party/go.mod
          cache-dependency-path: services/party/go.sum
      - name: Put $(go env GOPATH)/bin on PATH
        run: echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Install golang-migrate CLI
        run: go install -tags 'postgres' github.com/golang-migrate/migrate/v4/cmd/migrate@${{ env.MIGRATE_VERSION }}
      - name: migrate up (from empty database)
        run: make migrate-up
      - name: migrate version
        run: make migrate-version
      - name: migrate down (verify every down migration actually reverses cleanly)
        run: make migrate-down
      - name: migrate up again (verify re-applying from clean is still correct)
        run: make migrate-up

  integration-test:
    name: Integration test (live Postgres + Kafka via testcontainers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/party/go.mod
          cache-dependency-path: services/party/go.sum
      # ubuntu-latest runners ship Docker pre-installed and running --
      # no DOCKER_HOST/socket overrides needed here (those are only
      # required for local Colima setups; see PR_DESCRIPTION.md).
      - run: make test-integration
