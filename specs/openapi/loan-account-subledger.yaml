openapi: 3.1.0
info:
  title: Loan Account Subledger API
  version: 0.3.0
  description: >
    Owns loan account state (booking, disbursement, repayment, delinquency, payoff,
    charge-off, modification) and orchestrates calls to PartyAPI, GLPostingAPI, and
    PaymentAPI on the loan account's behalf. Retrofitted to the API/Event Spec
    Agent's conventions (v0.3.0, BREAKING from v0.2.0):
    (1) Money fields are the shared {amount: integer minor-units, currency}
    object; TermSet/TermVersion/LoanAccount are now the shared
    ../schemas/loan-account.schema.json objects referenced via $ref, not
    declared inline — annualInterestRate (decimal) is renamed
    annualInterestRateBps (integer basis points) as part of that move.
    (2) Every mutating operation's idempotency key moves from a body field
    (approvalReferenceId, disbursementId, etc.) to a required `Idempotency-Key`
    header. Batch-trigger operations (runDailyAccrual,
    runDailyDelinquencyAssessment) are the deliberate exception — they are
    idempotent by construction on their own (asOf, partitionIndex) body
    parameters, so no additional header is required; this is called out
    explicitly per operation rather than left as a silent inconsistency.
    (3) New operation: receiveRepaymentNotification. CB-REPAY originally
    modeled repayment creation as purely event-driven (PaymentAPI publishes
    payment.received, AccountAPI subscribes). Retrofitted to add a
    synchronous, Idempotency-Key-bearing endpoint as the authoritative trigger
    — the async event still exists for other consumers/audit, but this
    endpoint is now the source of truth PaymentAPI calls directly, matching
    the API/Event Spec Agent's explicit naming of this as one of the three
    canonical balance-affecting operations.
    (4) CB-PAYOFF (Early Settlement / Loan Payoff) paths added in this same
    increment: payoff quotes are read-only; settlement reuses
    receiveRepaymentNotification via an optional payoffQuoteId field rather
    than a separate endpoint, since a payoff payment IS an inbound payment,
    just one tagged with a quote reference.
    (5) CB-CHARGEOFF (Loan Charge-off & Write-off) added in this increment:
    charge-off itself is a new, separate action (POST /loan-accounts/{id}:chargeoff)
    since it's not triggered by any inbound payment — but recovery IS just
    another inbound payment, so receiveRepaymentNotification gains a third
    branch, checked FIRST, ahead of the existing repayment/payoff branching: a
    payment matched to a loan account already in "ChargedOff" status is always
    a recovery, regardless of whether payoffQuoteId is present — a charged-off
    account can never re-enter the ordinary repayment or payoff paths.
    (6) CB-MOD (Loan Modification) added in this increment: applyModification
    is the fourth new action-style operation, and the first whose GL posting
    is conditional at the request-shape level rather than the response-status
    level — a rate/term-only modification (Branch B, REQ-CB-MOD-004) makes
    zero calls to GLPostingAPI, full stop, not a call with a zero amount. Also
    adds GET /loan-accounts/{id}/term-versions (full audit history,
    REQ-CB-MOD-008) and GET /loan-accounts/{id}/term-versions:effective
    (single version resolution as of a date, REQ-CB-MOD-006) — the latter is
    what runDailyAccrual's rate/day-count/principal-basis resolution now
    references explicitly, since a loan with a modification whose effective
    date falls mid-accrual-cycle must resolve against the correct historical
    version, not always the current one.
  contact:
    name: Loan Account Subledger team
  x-adapter: AccountAdapter
  x-epics: [CB-BOOK, CB-DISB, CB-ACCR, CB-REPAY, CB-DELINQ, CB-PAYOFF, CB-CHARGEOFF, CB-MOD]
  x-req-ids:
    - REQ-CB-BOOK-001
    - REQ-CB-BOOK-002
    - REQ-CB-BOOK-003
    - REQ-CB-BOOK-004
    - REQ-CB-BOOK-005
    - REQ-CB-BOOK-006
    - REQ-CB-BOOK-007
    - REQ-CB-DISB-001
    - REQ-CB-DISB-002
    - REQ-CB-DISB-003
    - REQ-CB-DISB-004
    - REQ-CB-DISB-006
    - REQ-CB-DISB-007
    - REQ-CB-ACCR-001
    - REQ-CB-ACCR-002
    - REQ-CB-ACCR-003
    - REQ-CB-ACCR-004
    - REQ-CB-ACCR-005
    - REQ-CB-ACCR-006
    - REQ-CB-ACCR-007
    - REQ-CB-REPAY-001
    - REQ-CB-REPAY-002
    - REQ-CB-REPAY-003
    - REQ-CB-REPAY-004
    - REQ-CB-REPAY-005
    - REQ-CB-REPAY-006
    - REQ-CB-REPAY-007
    - REQ-CB-DELINQ-001
    - REQ-CB-DELINQ-002
    - REQ-CB-DELINQ-003
    - REQ-CB-DELINQ-004
    - REQ-CB-DELINQ-005
    - REQ-CB-DELINQ-006
    - REQ-CB-DELINQ-007
    - REQ-CB-DELINQ-008
    - REQ-CB-PAYOFF-001
    - REQ-CB-PAYOFF-002
    - REQ-CB-PAYOFF-003
