servers:
  - url: https://las.internal.core-banking.example/v1
    description: Loan Account Subledger — internal service network only

security:
  - serviceAuth: []

paths:
  /loan-accounts:book:
    post:
      operationId: bookLoanAccount
      summary: Book a loan account from an already-approved origination decision
      description: >
        REQ-CB-BOOK-001, 003, 004, 006. Creates a loan account in "Approved"
        (undisbursed) status with an immutable term version v1. Underwriting/credit
        decisioning is out of scope — this endpoint only ingests an already-approved
        decision. Idempotent on the Idempotency-Key header (value = the
        approvalReferenceId the caller is booking): replaying the same key with
        an identical payload returns the original resource (200) rather than
        creating a duplicate. Malformed/missing required terms are rejected
        synchronously (400) rather than persisted. No balance is posted at any
        point in this flow — zero GLPostingAPI calls, by design.
      tags: [Booking]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoanAccountBookingRequest'
            examples:
              standard:
                summary: "Idempotency-Key = a1b2c3d4-1111-4a5b-9c8d-2e3f4a5b6c7d"
                value:
                  approvalReferenceId: "a1b2c3d4-1111-4a5b-9c8d-2e3f4a5b6c7d"
                  partyId: "8b3a1e2f-3a4b-5c6d-9e2e-6b1a4c9d3f2a"
                  bookedBy: "origination-system"
                  terms:
                    principalAmount: { amount: 1500000, currency: USD }
                    annualInterestRateBps: 1499
                    termMonths: 36
                    dayCountConvention: ACTUAL_365
      responses:
        '201':
          description: Loan account booked in Approved status with term version v1
          content:
            application/json:
              schema:
                $ref: '../schemas/loan-account.schema.json#/$defs/LoanAccount'
        '200':
          description: Idempotent replay — original loan account resource returned unchanged
          content:
            application/json:
              schema:
                $ref: '../schemas/loan-account.schema.json#/$defs/LoanAccount'
        '400':
          description: >
            A required term (principal, rate, term, or day-count convention) is
            missing or malformed (REQ-CB-BOOK-001). No account is created. LAS also
            publishes loan.booking.rejected so the rejection lands on Batch/EOD's
            exception queue rather than only existing as an unlogged API error.
          content:
            application/json:
              schema: { $ref: '../schemas/error.schema.json#/$defs/Error' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: partyId does not resolve to an existing party
          content:
            application/json:
              schema: { $ref: '../schemas/error.schema.json#/$defs/Error' }
        '409':
          description: Idempotency-Key reused with a materially different payload
          content:
            application/json:
              schema: { $ref: '../schemas/error.schema.json#/$defs/Error' }
        '422':
          description: >
            REQ-CB-BOOK-002. Party/CIF validation failed — party is Blocked, Closed,
            or KYC is not Verified. No account is created; see `code` on the returned
            Error for the specific reason (PARTY_BLOCKED, PARTY_CLOSED,
            KYC_NOT_VERIFIED). LAS also publishes loan.booking.rejected.
          content:
            application/json:
              schema: { $ref: '../schemas/error.schema.json#/$defs/Error' }
        '500':
          $ref: '#/components/responses/InternalServerError'

  /loan-accounts/{loanAccountId}:
    get:
      operationId: getLoanAccount
      summary: Retrieve a loan account's current status and term version
      description: REQ-CB-BOOK-004, 006 — confirms booked state and zero balance; also the read other epics' orchestration logic uses to check account status preconditions.
      tags: [Booking]
      parameters:
        - $ref: '#/components/parameters/LoanAccountId'
      responses:
        '200':
          description: Current loan account state
          content:
            application/json:
              schema:
                $ref: '../schemas/loan-account.schema.json#/$defs/LoanAccount'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /loan-accounts/{loanAccountId}/payoff-quote:
    get:
      operationId: getPayoffQuote
      summary: Generate a payoff quote for a loan account
      description: >
        REQ-CB-PAYOFF-001, 002, 003. Read-only — has no side effects and posts
        nothing; this is a live calculation, not a cached/idempotent resource,
        since the underlying balance can change between calls (e.g. a same-day
        repayment). Returns outstanding principal, interest projected from the
        last confirmed accrual through `goodThrough`, and any outstanding fees,
        itemized separately (REQ-CB-PAYOFF-002). The returned `quoteId` is what
        a subsequent payoff payment must reference (as
        receiveRepaymentNotification's `payoffQuoteId`) for the payment to be
        matched against this specific quote rather than treated as an ordinary
        repayment.
      tags: [Payoff]
      parameters:
        - $ref: '#/components/parameters/LoanAccountId'
        - name: goodThrough
          in: query
          required: true
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Itemized payoff quote, valid through goodThrough
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PayoffQuote'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Loan account not found, or not in a status eligible for payoff (e.g. already Closed)
          content:
            application/json:
              schema: { $ref: '../schemas/error.schema.json#/$defs/Error' }
        '500':
          $ref: '#/components/responses/InternalServerError'

  /payoffs/{payoffId}:
    get:
      operationId: getPayoff
      summary: Retrieve the current state of a payoff
      description: >
        REQ-CB-PAYOFF-004 through 009. Polling fallback for clients not
        consuming loan.account.closed. `payoffId` is always the originating
        paymentReferenceId from the receiveRepaymentNotification call that
        settled it — same no-separate-ID-space convention as Repayment/Fee.
        There is no reversal endpoint for a Payoff in this increment — a
        returned/NSF payoff payment is not yet a specified flow (open question
        carried from the Design Doc); Ops must currently handle that case
        manually outside this API.
      tags: [Payoff]
      parameters:
        - name: payoffId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Current payoff state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payoff'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /loan-accounts/{loanAccountId}:chargeoff:
    post:
      operationId: recordChargeOff
      summary: Record a charge-off decision against a loan account
      description: >
        REQ-CB-CHARGEOFF-001, 002, 003, 004. Ingests an already-approved
        credit-policy decision — the decision itself (DPD threshold, approval
        chain) is made upstream, out of scope for this endpoint, which only
        records it and orchestrates the write-off. Creates the resource in
        "PendingChargeOff" status, posts PR-CHGOFF-01 via GLPostingAPI (whose
        `metadata.chargeoffDecisionReference`/`confirmedBy` retain the durable
        link to the upstream approval artifact — REQ-CB-CHARGEOFF NFR), and
        transitions to "ChargedOff" only once GL confirms
        (REQ-CB-CHARGEOFF-003, the same confirmed-posting-gates-status-change
        pattern as payoff closure). Idempotent on the Idempotency-Key header
        (value = chargeoffDecisionReference): a retried call returns the
        original outcome rather than writing off twice. Once ChargedOff, the
        account is permanently excluded from daily accrual and delinquency fee
        assessment (REQ-CB-CHARGEOFF-005) — the same status-based exclusion
        mechanism runDailyAccrual/runDailyDelinquencyAssessment already apply
        for Non-Accrual accounts.
      tags: [ChargeOff]
      parameters:
        - $ref: '#/components/parameters/LoanAccountId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecordChargeOffRequest'
            examples:
              standard:
                summary: "Idempotency-Key = COLLECTIONS-DEC-2026-08-14-00931"
                value:
                  chargeoffDecisionReference: "COLLECTIONS-DEC-2026-08-14-00931"
                  confirmedBy: "collections.system"
      responses:
        '201':
          description: Charge-off recorded; write-off posting in progress
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChargeOff'
        '200':
          description: Idempotent replay — original charge-off resource returned unchanged
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChargeOff'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: >
            Loan account is not in a charge-off-eligible status (e.g. already
            ChargedOff or Closed), OR the Idempotency-Key was reused with a
            materially different payload
          content:
            application/json:
              schema: { $ref: '../schemas/error.schema.json#/$defs/Error' }
        '500':
          $ref: '#/components/responses/InternalServerError'

  /chargeoffs/{chargeoffId}:
    get:
      operationId: getChargeOff
      summary: Retrieve the current state of a charge-off
      description: >
        REQ-CB-CHARGEOFF-001 through 004. Polling fallback for clients not
        consuming loan.account.chargedoff. `chargeoffId` is always the
        chargeoffDecisionReference used as the Idempotency-Key on
        recordChargeOff — no separate ID space.
      tags: [ChargeOff]
      parameters:
        - name: chargeoffId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Current charge-off state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChargeOff'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /recoveries/{recoveryId}:
    get:
      operationId: getRecovery
      summary: Retrieve the current state of a recovery payment
      description: >
        REQ-CB-CHARGEOFF-006. Polling fallback for clients not tracking
        gl.entry.posted directly. `recoveryId` is always the paymentReferenceId
        from the receiveRepaymentNotification call that produced it — no
        separate ID space. There is no reversal endpoint for a Recovery in
        this increment — a returned/NSF recovery payment is not a specified
        flow (same class of open question as payoff-payment reversal).
      tags: [ChargeOff]
      parameters:
        - name: recoveryId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Current recovery state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Recovery'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /loan-accounts/{loanAccountId}/modifications:
    post:
      operationId: applyModification
      summary: Apply an approved modification to an active loan account
      description: >
        REQ-CB-MOD-001, 002, 003, 004, 005. Ingests an already-approved
        modification decision — the approval itself is out of scope for this
        endpoint. Always appends a new immutable TermVersion effective
        `effectiveDate`; never edits a prior version (REQ-CB-MOD-002). Branches
        on whether `capitalization` is present:
        (a) present → Branch A. Posts PR-MOD-01 via GLPostingAPI for the
        combined interest+fee total, increasing the new TermVersion's
        principalAmount by that same total (REQ-CB-MOD-003).
        (b) absent → Branch B. No GLPostingAPI call at all — a true no-op, not
        a zero-amount posting (REQ-CB-MOD-004). Only rate/termMonths change,
        principalAmount carries forward unchanged from the prior version.
        Idempotent on the Idempotency-Key header (value =
        modificationReferenceId): a retried call returns the original
        Modification resource rather than appending a second TermVersion.
      tags: [Modification]
      parameters:
        - $ref: '#/components/parameters/LoanAccountId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApplyModificationRequest'
            examples:
              rateChangeOnly:
                summary: "Branch B — Idempotency-Key = c4d5e6f7-3333-4a5b-9c8d-4a5b6c7d8e9f"
                value:
                  effectiveDate: "2026-09-01"
                  confirmedBy: "ops.analyst.mramirez"
                  newAnnualInterestRateBps: 1299
              capitalization:
                summary: "Branch A — Idempotency-Key = d5e6f7a8-4444-4a5b-9c8d-5b6c7d8e9f0a"
                value:
                  effectiveDate: "2026-09-01"
                  confirmedBy: "ops.analyst.mramirez"
                  capitalization:
                    interestAmount: { amount: 8420, currency: USD }
                    feeAmount: { amount: 5000, currency: USD }
      responses:
        '201':
          description: Modification applied; new TermVersion appended (and, for Branch A, write-in-progress toward confirmed posting)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Modification'
        '200':
          description: Idempotent replay — original modification resource returned unchanged
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Modification'
        '400':
          description: Neither newAnnualInterestRateBps, newTermMonths, nor capitalization present — a modification must change something
          content:
            application/json:
              schema: { $ref: '../schemas/error.schema.json#/$defs/Error' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Loan account is not in a modifiable status (e.g. not yet Disbursed, or Closed/ChargedOff), OR the Idempotency-Key was reused with a materially different payload
          content:
            application/json:
              schema: { $ref: '../schemas/error.schema.json#/$defs/Error' }
        '500':
          $ref: '#/components/responses/InternalServerError'

  /modifications/{modificationId}:
    get:
      operationId: getModification
      summary: Retrieve the current state of a modification
      description: >
        REQ-CB-MOD-001 through 005. Polling fallback for clients not
        consuming loan.terms.modified. `modificationId` is always the
        modificationReferenceId used as the Idempotency-Key on
        applyModification — no separate ID space.
      tags: [Modification]
      parameters:
        - name: modificationId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Current modification state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Modification'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /loan-accounts/{loanAccountId}/term-versions:
    get:
      operationId: listTermVersions
      summary: Retrieve the full, unfiltered term-version history of a loan account
      description: >
        REQ-CB-MOD-008. Every version ever appended (booking's v1 plus every
        modification since), each with its effectiveDate and the specific
        terms it carried — the audit/dispute-resolution surface. Never
        filtered, never paginated by default; this is the complete history.
      tags: [Modification]
      parameters:
        - $ref: '#/components/parameters/LoanAccountId'
      responses:
        '200':
          description: Full term-version history, ordered by version ascending
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '../schemas/loan-account.schema.json#/$defs/TermVersion'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /loan-accounts/{loanAccountId}/term-versions:effective:
    get:
      operationId: getEffectiveTermVersion
      summary: Resolve the single term version in effect as of a given date
      description: >
        REQ-CB-MOD-006. The most recent TermVersion whose effectiveDate is on
        or before `asOf` — never a version that takes effect after `asOf`.
        This is the resolution runDailyAccrual performs internally
        (same-service, not by calling this endpoint) for every account whose
        term history includes a modification; exposed here as its own
        operation for external callers (Ops tooling, payoff-quote generation,
        audits) that need the same deterministic lookup without reaching into
        AccountAPI's internal state.
      tags: [Modification]
      parameters:
        - $ref: '#/components/parameters/LoanAccountId'
        - name: asOf
          in: query
          required: true
          schema:
            type: string
            format: date
      responses:
        '200':
          description: The single term version in effect as of asOf
          content:
            application/json:
              schema:
                $ref: '../schemas/loan-account.schema.json#/$defs/TermVersion'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Loan account not found, or asOf is before the account's booking date (no version exists yet)
          content:
            application/json:
              schema: { $ref: '../schemas/error.schema.json#/$defs/Error' }
        '500':
          $ref: '#/components/responses/InternalServerError'

  /loan-accounts:accrual-eligible:
    get:
      operationId: listAccrualEligibleAccounts
      summary: List loan accounts eligible for interest accrual as of a business date
      description: >
        REQ-CB-ACCR-001, 005, 006. Read-only — has no side effects and posts
        nothing. Eligible means status = "Disbursed" as of start of `asOf`,
        excluding Non-Accrual/Suspended (REQ-CB-ACCR-005) and accounts that reached
        zero principal or Closed status before the batch cutoff on `asOf`
        (REQ-CB-ACCR-006). Supports `partitionIndex`/`partitionCount` so Batch/EOD
        can fan this out across parallel workers to fit the overnight window.
        When `includeExcluded=true`, the response also lists accounts that were
        considered but excluded, with a reason each — REQ-CB-ACCR-001 requires
        exclusions to be explicit and logged, never silently absent.
      tags: [Accrual]
      parameters:
        - name: asOf
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: includeExcluded
          in: query
          schema:
            type: boolean
            default: false
        - name: partitionIndex
          in: query
          schema:
            type: integer
            minimum: 0
        - name: partitionCount
          in: query
          schema:
            type: integer
            minimum: 1
        - name: cursor
          in: query
          schema:
            type: string
        - name: pageSize
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 500
      responses:
        '200':
          description: Page of eligible (and optionally excluded) accounts for the given business date
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccrualEligibilityPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /loan-accounts:accrue:
    post:
      operationId: runDailyAccrual
      summary: Execute the daily interest accrual batch for a business date
      description: >
        REQ-CB-ACCR-001 through 007; REQ-CB-MOD-006. For every account
        eligible as of `asOf` (same eligibility rule as
        GET /loan-accounts:accrual-eligible), resolves rate/day-count/
        principal-basis from the term version effective as of `asOf` — the
        same resolution GET /loan-accounts/{id}/term-versions:effective
        exposes externally, computed here as a same-service internal lookup
        rather than a round-trip — then computes the day's interest and posts
        PR-ACCR-01 via GLPostingAPI, using an Idempotency-Key of the form
        `accr:{loanAccountId}:{asOf}` for each individual posting — GLPostingAPI's
        own idempotency on that key is what makes a partially-failed run safe to
        retry (REQ-CB-ACCR-003). This endpoint itself takes NO Idempotency-Key
        header: it is idempotent by construction on its own (asOf, partitionIndex)
        body parameters — a second call with the same body is always safe to
        retry, so an additional client-generated token would be redundant.
        Returns a summary Batch/EOD uses directly for the completeness
        cross-check (REQ-CB-ACCR-007); any account that was eligible but failed
        to post is listed in `failedAccountIds`, which should drive an
        accrual.exception.raised event if non-empty once every partition
        reports in.
      tags: [Accrual]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccrualBatchRequest'
            examples:
              fullRun:
                value:
                  asOf: "2026-08-16"
              partitionedRun:
                value:
                  asOf: "2026-08-16"
                  partitionIndex: 3
                  partitionCount: 16
      responses:
        '200':
          description: Batch run completed (safe to retry — returns the same summary for an already-completed asOf/partition)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccrualBatchSummary'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /loan-accounts:past-due:
    get:
      operationId: listPastDueAccounts
      summary: List loan accounts past due as of a business date
      description: >
        REQ-CB-DELINQ-001. Read-only — has no side effects and posts nothing.
        Past due means cumulative scheduled amount due through `asOf` exceeds
        cumulative amounts posted via PR-REPAY-01; an account current on its
        schedule, even if a payment was received late but within the same
        cycle, is not included. Reads only posted repayment entries, never an
        unconfirmed or pending payment.
      tags: [Delinquency]
      parameters:
        - name: asOf
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: dpdBucketMin
          in: query
          description: Filter to accounts at or beyond this bucket, e.g. "30-59"
          schema:
            type: string
            enum: ["1-29", "30-59", "60-89", "90+"]
        - name: partitionIndex
          in: query
          schema:
            type: integer
            minimum: 0
        - name: partitionCount
          in: query
          schema:
            type: integer
            minimum: 1
        - name: cursor
          in: query
          schema:
            type: string
        - name: pageSize
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 500
      responses:
        '200':
          description: Page of past-due accounts for the given business date
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PastDueAccountPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /loan-accounts:assess-delinquency:
    post:
      operationId: runDailyDelinquencyAssessment
      summary: Execute the daily delinquency assessment batch for a business date
      description: >
        REQ-CB-DELINQ-001 through 005, 008; REQ-CB-CHARGEOFF-005. For every
        account with a payment schedule EXCLUDING accounts already in
        "ChargedOff" status (REQ-CB-CHARGEOFF-005 — a written-off asset is
        never re-assessed for a late fee it will never realistically collect):
        updates the DPD count/bucket for `asOf` (REQ-CB-DELINQ-003);
        for accounts newly past their contractual grace period, posts
        PR-DELINQ-01 via GLPostingAPI using an Idempotency-Key of the form
        `late-fee:{loanAccountId}:{scheduledDueDate}` (REQ-CB-DELINQ-002, 004);
        and for accounts whose DPD crosses the non-accrual threshold, sets
        LoanAccount.nonAccrualFlag = true with nonAccrualSince = `asOf`
        (REQ-CB-DELINQ-005). Publishes delinquency.status.changed for every
        account whose dpdBucket changed. Like runDailyAccrual, this endpoint
        takes no Idempotency-Key header — idempotent by construction on its own
        (asOf, partitionIndex) body parameters.
      tags: [Delinquency]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DelinquencyBatchRequest'
            examples:
              fullRun:
                value:
                  asOf: "2026-08-16"
              partitionedRun:
                value:
                  asOf: "2026-08-16"
                  partitionIndex: 3
                  partitionCount: 16
      responses:
        '200':
          description: Batch run completed (safe to retry — returns the same summary for an already-completed asOf/partition)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DelinquencyBatchSummary'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /fees/{feeId}:
    get:
      operationId: getFee
      summary: Retrieve the current state of an assessed late fee
      description: >
        REQ-CB-DELINQ-002, 004, 007. `feeId` is always the deterministic
        `late-fee:{loanAccountId}:{scheduledDueDate}` string, same value used as
        GLPostingAPI's Idempotency-Key for PR-DELINQ-01.
      tags: [Delinquency]
      parameters:
        - name: feeId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Current fee state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Fee'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /fees/{feeId}:waive:
    post:
      operationId: waiveFee
      summary: Waive a previously assessed late fee
      description: >
        REQ-CB-DELINQ-007. Requires the fee to be in "Assessed" status. Posts
        PR-DELINQ-02 (reversal of PR-DELINQ-01) via GLPostingAPI, using
        metadata.waivedBy/reasonCode carried through from this request; the
        original assessment entry is never edited. `confirmedBy` and
        `reasonCode` are both required — a mandatory authorization record, not
        an optional annotation. Idempotent on the Idempotency-Key header (value
        = `{feeId}:waive`): a retried call returns the original waiver outcome
        rather than attempting a second GL posting.
      tags: [Delinquency]
      parameters:
        - name: feeId
          in: path
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WaiveFeeRequest'
      responses:
        '202':
          description: Waiver accepted and in progress; poll GET for terminal status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Fee'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Fee is not in "Assessed" status (already waived, or not yet assessed), or Idempotency-Key reused with a materially different payload
          content:
            application/json:
              schema: { $ref: '../schemas/error.schema.json#/$defs/Error' }
        '500':
          $ref: '#/components/responses/InternalServerError'

  /repayments:notify:
    post:
      operationId: receiveRepaymentNotification
      summary: Receive notification of an inbound payment (repayment, payoff, or recovery) and process it
      description: >
        REQ-CB-REPAY-001 through 005; REQ-CB-PAYOFF-003 through 008;
        REQ-CB-CHARGEOFF-006. Called synchronously by PaymentAPI immediately
        upon receipt of an inbound payment. Idempotent on the Idempotency-Key
        header (value = paymentReferenceId): a retried call returns the
        original outcome and never re-applies the payment. First matches
        `loanAccountRef` to exactly one active loan account (REQ-CB-REPAY-001;
        ambiguous/no match publishes payment.match.failed and returns a
        Repayment with status Unmatched, still 201/200, not an error — the
        payment was received successfully, it just couldn't be matched). Once
        matched, branches:
        (0) matched loan account is in "ChargedOff" status → ALWAYS a recovery
        (REQ-CB-CHARGEOFF-006), checked before any of the branches below —
        `payoffQuoteId` is ignored if present, since a charged-off account can
        never re-enter the ordinary repayment or payoff paths. Posts
        PR-CHGOFF-02 for the full received amount and returns a Recovery
        resource; the account remains ChargedOff.
        (a) not charged off, `payoffQuoteId` absent → standard repayment path
        — applies the fees→interest→principal waterfall and posts PR-REPAY-01
        (REQ-CB-REPAY-002, 003).
        (b) not charged off, `payoffQuoteId` present and references a valid,
        unexpired PayoffQuote, with amount exactly equal to the quote total →
        posts PR-PAYOFF-01 for that exact amount, closes the loan account once
        GLPostingAPI confirms (REQ-CB-PAYOFF-004, 005, 006), and returns a
        Payoff resource instead of a Repayment.
        (c) present but amount is LESS than the quote total → degrades to the
        standard repayment path (REQ-CB-PAYOFF-007); the account is not closed
        and a new quote is required.
        (d) present but amount EXCEEDS the quote total → posts PR-PAYOFF-01 for
        exactly the quoted amount, closes the account, and routes the excess to
        Payoff.suspenseAmount (REQ-CB-PAYOFF-007) — mirroring how an
        over-scoped ordinary repayment routes excess to Repayment.suspenseAmount.
        (e) present but the quote is expired (past goodThrough) or not found →
        treated as case (a), same as if no payoffQuoteId had been sent
        (REQ-CB-PAYOFF-003's "quote is rejected as expired" becomes, for
        already-received money, "falls back to ordinary repayment processing"
        rather than a synchronous rejection, since there is no caller left to
        reject to once funds have arrived — flagged as an open question in the
        Design Doc, resolved here as the least-surprising default rather than
        silently dropping the payment).
      tags: [Repayment, Payoff, ChargeOff]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReceiveRepaymentNotificationRequest'
            examples:
              repayment:
                summary: "Idempotency-Key = ACH-2026081600123456"
                value:
                  loanAccountRef: "LN-000482910"
                  amount: { amount: 51000, currency: USD }
                  rail: ACH
                  receivedAt: "2026-08-16T09:12:00Z"
              payoff:
                summary: "Idempotency-Key = WIRE-2026081600009321"
                value:
                  loanAccountRef: "LN-000482910"
                  payoffQuoteId: "c4d5e6f7-2222-4a5b-9c8d-3f4a5b6c7d8e"
                  amount: { amount: 1500000, currency: USD }
                  rail: WIRE
                  receivedAt: "2026-08-16T09:12:00Z"
              recovery:
                summary: "Idempotency-Key = ACH-2026090200master77 (loanAccountRef matches an already-ChargedOff account)"
                value:
                  loanAccountRef: "LN-000398214"
                  amount: { amount: 15000, currency: USD }
                  rail: ACH
                  receivedAt: "2026-09-02T14:03:00Z"
      responses:
        '201':
          description: Payment processed (Repayment, Payoff, or Recovery created, per the branching above)
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/Repayment'
                  - $ref: '#/components/schemas/Payoff'
                  - $ref: '#/components/schemas/Recovery'
        '200':
          description: Idempotent replay — original outcome returned, nothing re-applied
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/Repayment'
                  - $ref: '#/components/schemas/Payoff'
                  - $ref: '#/components/schemas/Recovery'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: Idempotency-Key reused with a materially different payload
          content:
            application/json:
              schema: { $ref: '../schemas/error.schema.json#/$defs/Error' }
        '500':
          $ref: '#/components/responses/InternalServerError'

  /repayments/{repaymentId}:
    get:
      operationId: getRepayment
      summary: Retrieve the current state of a repayment
      description: >
        REQ-CB-REPAY-001 through 004, 006. Polling fallback for clients not
        consuming loan.repayment.posted/payment.match.failed. `repaymentId` is
        always the originating paymentReferenceId — no separate ID space.
      tags: [Repayment]
      parameters:
        - name: repaymentId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Current repayment state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Repayment'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /repayments/{repaymentId}:reverse:
    post:
      operationId: reverseRepayment
      summary: Reverse a returned/NSF repayment, or correct a misapplied one
      description: >
        REQ-CB-REPAY-007. Requires the repayment to be in "Posted" status.
        Always posts PR-REPAY-02 via GLPostingAPI; the original PR-REPAY-01
        entry is never edited. When `reasonCode = MISAPPLIED`, also books a
        fresh PR-REPAY-01 against `correctedLoanAccountId` under a new
        Idempotency-Key (`{repaymentId}:correction`). Idempotent on this
        operation's own Idempotency-Key header (value = `{repaymentId}:reverse`):
        a retried call returns the original result rather than reversing twice.
      tags: [Repayment]
      parameters:
        - name: repaymentId
          in: path
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReverseRepaymentRequest'
            examples:
              returned:
                summary: NSF / payment returned by the rail
                value:
                  confirmedBy: "ops.analyst.mramirez"
                  reasonCode: PAYMENT_RETURNED
              misapplied:
                summary: Payment was posted against the wrong loan account
                value:
                  confirmedBy: "ops.analyst.mramirez"
                  reasonCode: MISAPPLIED
                  correctedLoanAccountId: "9c8d2e3f-4a5b-6c7d-8b3a-1e2f3a4b5c6d"
      responses:
        '202':
          description: Reversal (and correction, if applicable) accepted and in progress; poll GET for terminal status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Repayment'
        '400':
          description: reasonCode = MISAPPLIED without correctedLoanAccountId
          content:
            application/json:
              schema: { $ref: '../schemas/error.schema.json#/$defs/Error' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Repayment is not in "Posted" status, or Idempotency-Key reused with a materially different payload
          content:
            application/json:
              schema: { $ref: '../schemas/error.schema.json#/$defs/Error' }
        '500':
          $ref: '#/components/responses/InternalServerError'

  /loan-accounts/{loanAccountId}/disbursements:
    post:
      operationId: createDisbursement
      summary: Initiate a disbursement request against an approved loan account
      description: >
        REQ-CB-DISB-001. Accepts a disbursement request for a loan account currently
        in "Approved" status. Does not move any balance — the resulting resource is
        created in "PendingDisbursement" state. Idempotent on the Idempotency-Key
        header (value = disbursementId): replaying the same key with an identical
        payload returns the original resource (200) rather than creating a
        duplicate.
      tags: [Disbursement]
      parameters:
        - $ref: '#/components/parameters/LoanAccountId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DisbursementRequest'
            examples:
              standard:
                summary: "Idempotency-Key = 3f2a9e2e-6b1a-4c9d-8b3a-1e2f3a4b5c6d"
                value:
                  requestedBy: "loan.officer.jsmith"
      responses:
        '201':
          description: Disbursement request accepted; created in PendingDisbursement state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Disbursement'
        '200':
          description: Idempotent replay — returns the original disbursement resource unchanged
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Disbursement'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Loan account not found
          content:
            application/json:
              schema: { $ref: '../schemas/error.schema.json#/$defs/Error' }
        '409':
          description: >
            Loan account is not in "Approved" status, OR the Idempotency-Key was
            reused with a materially different payload
          content:
            application/json:
              schema: { $ref: '../schemas/error.schema.json#/$defs/Error' }
        '422':
          description: >
            Party/CIF validation failed (REQ-CB-DISB-002) — party blocked, closed, or
            KYC not Verified. See `rejectionReason` on the returned resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Disbursement'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /loan-accounts/{loanAccountId}/disbursements/{disbursementId}:
    get:
      operationId: getDisbursement
      summary: Retrieve the current state of a disbursement request
      description: REQ-CB-DISB-001, 003, 004, 007 — polling fallback for clients not consuming loan.account.disbursed.
      tags: [Disbursement]
      parameters:
        - $ref: '#/components/parameters/LoanAccountId'
        - name: disbursementId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Current disbursement state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Disbursement'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /loan-accounts/{loanAccountId}/disbursements/{disbursementId}:reverse:
    post:
      operationId: reverseDisbursement
      summary: Trigger a reversal of a failed/returned disbursement
      description: >
        REQ-CB-DISB-007. Ops-confirmed reversal path. Only valid when the disbursement
        is in "Disbursed" status and PaymentAPI has reported the payment as
        returned/failed. Orchestrates a new offsetting journal entry (PR-DISB-02) via
        GLPostingAPI; the original PR-DISB-01 entry is never edited. The loan account
        reverts to "Approved" only after GL confirms the reversal entry. Idempotent
        on the Idempotency-Key header (value = `{disbursementId}:reverse`).
      tags: [Disbursement]
      parameters:
        - $ref: '#/components/parameters/LoanAccountId'
        - name: disbursementId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [confirmedBy, reasonCode]
              properties:
                confirmedBy:
                  type: string
                  description: Operations Analyst confirming the payment failure/return
                reasonCode:
                  type: string
                  enum: [PAYMENT_RETURNED, PAYMENT_FAILED, RAIL_REJECTED]
      responses:
        '202':
          description: Reversal accepted and in progress; poll GET for terminal status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Disbursement'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Disbursement is not in a reversible state, or Idempotency-Key reused with a materially different payload
          content:
            application/json:
              schema: { $ref: '../schemas/error.schema.json#/$defs/Error' }
        '500':
          $ref: '#/components/responses/InternalServerError'

components:
  parameters:
    LoanAccountId:
      name: loanAccountId
      in: path
      required: true
      schema:
        type: string
        format: uuid

    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Client-supplied retry-safety token for this specific business event. Value convention documented per operation.
      schema:
        type: string

  securitySchemes:
    serviceAuth:
      type: oauth2
      description: OAuth2 client-credentials grant, internal service network + mTLS at the transport layer
      flows:
        clientCredentials:
          tokenUrl: https://auth.internal.core-banking.example/oauth2/token
          scopes:
            loan-subledger:booking:write: Book loan accounts
            loan-subledger:booking:read: Read loan account status
            loan-subledger:disbursement:write: Create and reverse disbursements
            loan-subledger:disbursement:read: Read disbursement status
            loan-subledger:accrual:write: Trigger the daily accrual batch
            loan-subledger:accrual:read: Read accrual eligibility
            loan-subledger:repayment:write: Receive repayment notifications and reverse/correct repayments
            loan-subledger:repayment:read: Read repayment status
            loan-subledger:delinquency:write: Trigger the daily delinquency batch and waive fees
            loan-subledger:delinquency:read: Read past-due status and fee state
            loan-subledger:payoff:read: Generate payoff quotes and read payoff status
            loan-subledger:chargeoff:write: Record charge-off decisions
            loan-subledger:chargeoff:read: Read charge-off and recovery status
            loan-subledger:modification:write: Apply loan modifications
            loan-subledger:modification:read: Read modification and term-version history

  responses:
    BadRequest:
      description: Malformed request
      content:
        application/json:
          schema: { $ref: '../schemas/error.schema.json#/$defs/Error' }
    Unauthorized:
      description: Missing or invalid access token
      content:
        application/json:
          schema: { $ref: '../schemas/error.schema.json#/$defs/Error' }
    Forbidden:
      description: Token valid but missing the required scope
      content:
        application/json:
          schema: { $ref: '../schemas/error.schema.json#/$defs/Error' }
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema: { $ref: '../schemas/error.schema.json#/$defs/Error' }
    InternalServerError:
      description: Unexpected server error
      content:
        application/json:
          schema: { $ref: '../schemas/error.schema.json#/$defs/Error' }

  schemas:
    Capitalization:
      type: object
      required: [interestAmount, feeAmount]
      description: >
        Same shape and meaning as GLPostingAPI's Capitalization schema —
        duplicated rather than shared across service boundaries, consistent
        with how Allocation is already duplicated (Capitalization was not in
        the API/Event Spec Agent's named shared-object list either).
      properties:
        interestAmount: { $ref: '../schemas/money.schema.json#/$defs/Money' }
        feeAmount: { $ref: '../schemas/money.schema.json#/$defs/Money' }

    ApplyModificationRequest:
      type: object
      required: [effectiveDate, confirmedBy]
      description: >
        At least one of newAnnualInterestRateBps, newTermMonths, or
        capitalization must be present — a modification must change
        something. termMonths and rate are independently optional (a
        modification can change either, both, or neither if it's a
        capitalization-only event); dayCountConvention is not modifiable
        through this endpoint — it is fixed at booking.
      properties:
        effectiveDate:
          type: string
          format: date
        confirmedBy:
          type: string
        newAnnualInterestRateBps:
          type: integer
          exclusiveMinimum: 0
          description: Omit if the rate is unchanged.
        newTermMonths:
          type: integer
          exclusiveMinimum: 0
          description: Omit if the remaining term is unchanged.
        capitalization:
          $ref: '#/components/schemas/Capitalization'

    Modification:
      type: object
      required: [modificationId, loanAccountId, effectiveDate, previousTermVersion, newTermVersion, confirmedBy, updatedAt]
      properties:
        modificationId:
          type: string
          description: Equal to the Idempotency-Key header value used on applyModification (REQ-CB-MOD-005)
        loanAccountId:
          type: string
          format: uuid
        effectiveDate:
          type: string
          format: date
        previousTermVersion:
          type: integer
        newTermVersion:
          type: integer
        capitalizedAmount:
          oneOf:
            - $ref: '../schemas/money.schema.json#/$defs/Money'
            - type: "null"
          description: Total capitalized (interest + fee combined). Null/absent for a Branch B (rate/term-only) modification.
        journalEntryId:
          type: ["string", "null"]
          format: uuid
          description: Set only for Branch A, once PR-MOD-01 is confirmed posted. Always null for Branch B — REQ-CB-MOD-004's no-op means there is nothing to reference.
        confirmedBy:
          type: string
        updatedAt:
          type: string
          format: date-time

    RecordChargeOffRequest:
      type: object
      required: [chargeoffDecisionReference, confirmedBy]
      properties:
        chargeoffDecisionReference:
          type: string
          description: Must equal the Idempotency-Key header value. The durable link to the upstream credit-policy approval artifact (REQ-CB-CHARGEOFF NFR) — retained verbatim on the PR-CHGOFF-01 entry's metadata, not just here.
        confirmedBy:
          type: string
          description: Identity of the confirming system/user

    ChargeOff:
      type: object
      required: [chargeoffId, loanAccountId, status, writeOffAmount, chargeoffDecisionReference, confirmedBy, updatedAt]
      properties:
        chargeoffId:
          type: string
          description: Equal to the Idempotency-Key header value used on recordChargeOff
        loanAccountId:
          type: string
          format: uuid
        status:
          type: string
          enum: [PendingChargeOff, ChargedOff]
        writeOffAmount:
          allOf:
            - $ref: '../schemas/money.schema.json#/$defs/Money'
          description: Total written off (principal + interest + any outstanding fees)
        journalEntryId:
          type: ["string", "null"]
          format: uuid
          description: Set once PR-CHGOFF-01 is confirmed posted
        chargeoffDecisionReference:
          type: string
        confirmedBy:
          type: string
        chargedOffAt:
          type: ["string", "null"]
          format: date-time
          description: Set only once GLPostingAPI confirms the write-off entry (REQ-CB-CHARGEOFF-003)
        updatedAt:
          type: string
          format: date-time

    Recovery:
      type: object
      required: [recoveryId, loanAccountId, amount, receivedAt, updatedAt]
      properties:
        recoveryId:
          type: string
          description: Equal to the Idempotency-Key header value used on receiveRepaymentNotification (REQ-CB-CHARGEOFF-006)
        loanAccountId:
          type: string
          format: uuid
          description: Always a ChargedOff account — recovery never applies to any other status
        amount:
          $ref: '../schemas/money.schema.json#/$defs/Money'
        journalEntryId:
          type: ["string", "null"]
          format: uuid
          description: Set once PR-CHGOFF-02 is confirmed posted. Deliberately NOT a reference to the original PR-CHGOFF-01 entry — recovery is a distinct entry type, not a reversal.
        receivedAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    LoanAccountBookingRequest:
      type: object
      required: [approvalReferenceId, partyId, bookedBy, terms]
      properties:
        approvalReferenceId:
          type: string
          format: uuid
          description: Must equal the Idempotency-Key header value (REQ-CB-BOOK-004)
        partyId:
          type: string
          format: uuid
        bookedBy:
          type: string
        terms:
          $ref: '../schemas/loan-account.schema.json#/$defs/TermSet'

    PayoffQuote:
      type: object
      required: [quoteId, loanAccountId, goodThrough, principalAmount, projectedInterestAmount, feesAmount, totalAmountDue, generatedAt]
      properties:
        quoteId:
          type: string
          format: uuid
        loanAccountId:
          type: string
          format: uuid
        goodThrough:
          type: string
          format: date
        principalAmount: { $ref: '../schemas/money.schema.json#/$defs/Money' }
        projectedInterestAmount:
          allOf:
            - $ref: '../schemas/money.schema.json#/$defs/Money'
          description: Interest from the last confirmed PR-ACCR-01 posting through goodThrough
        feesAmount: { $ref: '../schemas/money.schema.json#/$defs/Money' }
        totalAmountDue:
          allOf:
            - $ref: '../schemas/money.schema.json#/$defs/Money'
          description: principalAmount + projectedInterestAmount + feesAmount
        generatedAt:
          type: string
          format: date-time

    Payoff:
      type: object
      required: [payoffId, loanAccountId, quoteId, status, amountPosted, suspenseAmount, closedAt, updatedAt]
      properties:
        payoffId:
          type: string
        loanAccountId:
          type: string
          format: uuid
        quoteId:
          type: string
          format: uuid
        status:
          type: string
          enum: [Posted, Closed]
        amountPosted: { $ref: '../schemas/money.schema.json#/$defs/Money' }
        suspenseAmount:
          allOf:
            - $ref: '../schemas/money.schema.json#/$defs/Money'
          description: REQ-CB-PAYOFF-007. Any amount received in excess of the quote total.
        journalEntryId:
          type: ["string", "null"]
          format: uuid
          description: Set once PR-PAYOFF-01 is confirmed posted
        closedAt:
          type: ["string", "null"]
          format: date-time
          description: REQ-CB-PAYOFF-006. Set only once the loan account transitions to Closed, which happens only after GL confirms the posting.
        updatedAt:
          type: string
          format: date-time

    AccrualEligibleAccount:
      type: object
      required: [loanAccountId, principalBasis, annualInterestRateBps, dayCountConvention, termVersion]
      properties:
        loanAccountId:
          type: string
          format: uuid
        principalBasis:
          allOf:
            - $ref: '../schemas/money.schema.json#/$defs/Money'
          description: Start-of-day outstanding principal used as the accrual basis (REQ-CB-ACCR-004)
        annualInterestRateBps:
          type: integer
        dayCountConvention:
          type: string
          enum: [ACTUAL_365, ACTUAL_360, THIRTY_360]
        termVersion:
          type: integer

    AccrualExclusion:
      type: object
      required: [loanAccountId, reasonCode]
      properties:
        loanAccountId:
          type: string
          format: uuid
        reasonCode:
          type: string
          enum: [PENDING_DISBURSEMENT, CLOSED, NON_ACCRUAL, SUSPENDED, CHARGED_OFF]
          description: REQ-CB-ACCR-001 requires every exclusion to carry an explicit reason, never a silent omission.

    AccrualEligibilityPage:
      type: object
      required: [asOf, eligibleAccounts, nextCursor]
      properties:
        asOf:
          type: string
          format: date
        eligibleAccounts:
          type: array
          items:
            $ref: '#/components/schemas/AccrualEligibleAccount'
        excludedAccounts:
          type: array
          items:
            $ref: '#/components/schemas/AccrualExclusion'
        nextCursor:
          type: ["string", "null"]

    AccrualBatchRequest:
      type: object
      required: [asOf]
      properties:
        asOf:
          type: string
          format: date
        partitionIndex:
          type: integer
          minimum: 0
        partitionCount:
          type: integer
          minimum: 1

    AccrualBatchSummary:
      type: object
      required: [asOf, eligibleAccountCount, postedCount, excludedCount, failedAccountIds, startedAt, completedAt, status]
      properties:
        asOf:
          type: string
          format: date
        partitionIndex:
          type: ["integer", "null"]
        partitionCount:
          type: ["integer", "null"]
        eligibleAccountCount:
          type: integer
        postedCount:
          type: integer
        excludedCount:
          type: integer
        failedAccountIds:
          type: array
          items:
            type: string
            format: uuid
        startedAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time
        status:
          type: string
          enum: [Completed, PartiallyFailed]

    PastDueAccount:
      type: object
      required: [loanAccountId, dpd, dpdBucket, scheduledAmountDue, postedAmount, pastDueAmount, gracePeriodExpired, nonAccrualFlag]
      properties:
        loanAccountId:
          type: string
          format: uuid
        dpd:
          type: integer
          minimum: 0
        dpdBucket:
          type: string
          enum: ["Current", "1-29", "30-59", "60-89", "90+"]
        scheduledAmountDue: { $ref: '../schemas/money.schema.json#/$defs/Money' }
        postedAmount: { $ref: '../schemas/money.schema.json#/$defs/Money' }
        pastDueAmount: { $ref: '../schemas/money.schema.json#/$defs/Money' }
        gracePeriodExpired:
          type: boolean
        nonAccrualFlag:
          type: boolean

    PastDueAccountPage:
      type: object
      required: [asOf, accounts, nextCursor]
      properties:
        asOf:
          type: string
          format: date
        accounts:
          type: array
          items:
            $ref: '#/components/schemas/PastDueAccount'
        nextCursor:
          type: ["string", "null"]

    DelinquencyBatchRequest:
      type: object
      required: [asOf]
      properties:
        asOf:
          type: string
          format: date
        partitionIndex:
          type: integer
          minimum: 0
        partitionCount:
          type: integer
          minimum: 1

    DelinquencyBatchSummary:
      type: object
      required: [asOf, evaluatedAccountCount, newlyPastDueCount, feesAssessedCount, nonAccrualFlaggedCount, failedAccountIds, startedAt, completedAt, status]
      properties:
        asOf:
          type: string
          format: date
        partitionIndex:
          type: ["integer", "null"]
        partitionCount:
          type: ["integer", "null"]
        evaluatedAccountCount:
          type: integer
        newlyPastDueCount:
          type: integer
        feesAssessedCount:
          type: integer
        nonAccrualFlaggedCount:
          type: integer
        failedAccountIds:
          type: array
          items:
            type: string
            format: uuid
        startedAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time
        status:
          type: string
          enum: [Completed, PartiallyFailed]

    Fee:
      type: object
      required: [feeId, loanAccountId, scheduledDueDate, amount, status, assessedAt, updatedAt]
      properties:
        feeId:
          type: string
          description: "Deterministic: late-fee:{loanAccountId}:{scheduledDueDate}"
        loanAccountId:
          type: string
          format: uuid
        scheduledDueDate:
          type: string
          format: date
        amount: { $ref: '../schemas/money.schema.json#/$defs/Money' }
        status:
          type: string
          enum: [Assessed, WaivePending, Waived]
        journalEntryId:
          type: ["string", "null"]
          format: uuid
        waivedBy:
          type: ["string", "null"]
        waiveReasonCode:
          type: ["string", "null"]
          enum: [GOODWILL, BANK_ERROR, HARDSHIP, null]
        waivedAt:
          type: ["string", "null"]
          format: date-time
        assessedAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    WaiveFeeRequest:
      type: object
      required: [confirmedBy, reasonCode]
      properties:
        confirmedBy:
          type: string
          description: Operations Analyst approving the waiver — mandatory authorization record (REQ-CB-DELINQ-007)
        reasonCode:
          type: string
          enum: [GOODWILL, BANK_ERROR, HARDSHIP]
        notes:
          type: string

    Allocation:
      type: object
      required: [feeAmount, interestAmount, principalAmount]
      description: >
        Same shape as GLPostingAPI's Allocation schema — duplicated rather than
        shared across service boundaries, since each module's OpenAPI contract
        must stand alone (Allocation was not in the API/Event Spec Agent's
        named shared-object list, unlike Money/Party/JournalEntry/LoanAccount/
        PaymentInstruction/ServiceCase).
      properties:
        feeAmount: { $ref: '../schemas/money.schema.json#/$defs/Money' }
        interestAmount: { $ref: '../schemas/money.schema.json#/$defs/Money' }
        principalAmount: { $ref: '../schemas/money.schema.json#/$defs/Money' }

    ReceiveRepaymentNotificationRequest:
      type: object
      required: [amount, rail, receivedAt]
      properties:
        loanAccountRef:
          type: ["string", "null"]
          description: Whatever loan-account reference the payer supplied, verbatim. Null/unresolvable drives the Unmatched path (REQ-CB-REPAY-001).
        payoffQuoteId:
          type: ["string", "null"]
          format: uuid
          description: >
            If present, this payment is a payoff attempt against the
            referenced PayoffQuote — ignored if the matched loan account is
            already ChargedOff, since that case is always a recovery
            regardless of this field (see receiveRepaymentNotification's
            branching description).
        amount: { $ref: '../schemas/money.schema.json#/$defs/Money' }
        rail:
          type: string
        receivedAt:
          type: string
          format: date-time

    Repayment:
      type: object
      required: [repaymentId, status, amount, suspenseAmount, receivedAt, updatedAt]
      properties:
        repaymentId:
          type: string
          description: Equal to the Idempotency-Key header value used on receiveRepaymentNotification (REQ-CB-REPAY-004)
        loanAccountId:
          type: ["string", "null"]
          format: uuid
          description: Null while status = Unmatched
        status:
          type: string
          enum: [Posted, Unmatched, ReversalPending, Reversed, Corrected]
        amount: { $ref: '../schemas/money.schema.json#/$defs/Money' }
        allocation:
          $ref: '#/components/schemas/Allocation'
        suspenseAmount:
          allOf:
            - $ref: '../schemas/money.schema.json#/$defs/Money'
          description: >
            REQ-CB-REPAY-002. Any amount exceeding total outstanding balance,
            routed here instead of over-applying principal. Full suspense
            disposition (auto-refund vs. held pending borrower instruction) is
            a separate, not-yet-specified flow — this field only records the
            amount, it does not model the disposition workflow.
        journalEntryId:
          type: ["string", "null"]
          format: uuid
        unmatchedReasonCode:
          type: ["string", "null"]
          enum: [NO_MATCH, AMBIGUOUS_MATCH, null]
        correctedRepaymentId:
          type: ["string", "null"]
        receivedAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    ReverseRepaymentRequest:
      type: object
      required: [confirmedBy, reasonCode]
      properties:
        confirmedBy:
          type: string
        reasonCode:
          type: string
          enum: [PAYMENT_RETURNED, MISAPPLIED]
        correctedLoanAccountId:
          type: string
          format: uuid
          description: Required when reasonCode = MISAPPLIED; ignored otherwise

    DisbursementRequest:
      type: object
      required: [requestedBy]
      properties:
        requestedBy:
          type: string
          description: Identity of the requesting Loan Officer

    Disbursement:
      type: object
      required: [disbursementId, loanAccountId, status, principalAmount, createdAt, updatedAt]
      properties:
        disbursementId:
          type: string
          format: uuid
          description: Equal to the Idempotency-Key header value used on createDisbursement (REQ-CB-DISB-004)
        loanAccountId:
          type: string
          format: uuid
        status:
          type: string
          enum: [PendingDisbursement, Rejected, Disbursed, ReversalPending, Reversed]
        principalAmount:
          allOf:
            - $ref: '../schemas/money.schema.json#/$defs/Money'
          description: Full undisbursed principal as of booking; not client-supplied
        rejectionReason:
          type: ["string", "null"]
        journalEntryId:
          type: ["string", "null"]
          format: uuid
        instructionId:
          type: ["string", "null"]
          format: uuid
          description: The PaymentAPI PaymentInstruction ID once submitted
        requestedBy:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
