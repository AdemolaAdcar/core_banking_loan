asyncapi: 2.6.0
info:
  title: General Ledger & Posting Engine Events
  version: 0.4.0
  description: >
    Domain events published by GLPostingAdapter whenever a JournalEntry is
    posted, or a period is closed. v0.4.0 adds `gl.period.closed`
    (invariant 7's "period close is a distinct, auditable operation" —
    Batch/EOD needs to know a period locked, since it drives whether a
    correction it initiates must go through priorPeriodAdjustmentForPeriodId
    instead of an ordinary entry). `gl.entry.posted`'s payload also picks
    up JournalEntry's new required fields (postingRuleVersion, periodId,
    isPriorPeriodAdjustment, adjustmentForPeriodId) automatically, since it
    is a $ref to the shared schema, not a locally duplicated one — no event
    schema change was needed for that part.

    One channel serves every posting rule across every epic —
    consumers filter on `postingRuleCode`. Retrofitted to the API/Event Spec
    Agent's conventions (v0.3.0, BREAKING from v0.2.0): topic renamed from
    `gl.journal-entry.posted.v1` to `gl.entry.posted` (the
    "<context>.<entity>.<eventPastTense>" convention, no version suffix —
    version now lives only in info.version); payload is now the shared
    JournalEntry object (../schemas/journal-entry.schema.json) referenced via
    $ref instead of a locally-duplicated schema — this is also where
    `runningBalanceAfter` (Money, per line) first appears on the event, same
    as it does on postJournalEntry's synchronous response. This increment
    additionally documents CB-CHARGEOFF's rules (PR-CHGOFF-01, PR-CHGOFF-02)
    — no payload change was needed, since the shared JournalEntry schema
    already generalizes over any rule's debit account, including PR-CHGOFF-01's
    AllowanceForLoanLosses (the first rule in the catalog whose debit side
    isn't Cash/Nostro or an Income-reversal — the schema's genericity is what
    made that a zero-change addition). This increment additionally documents
    CB-MOD's rule (PR-MOD-01) — again no payload change, for the same reason:
    the shared JournalEntry schema's generic `lines` array already represents
    a single-debit/multi-credit entry regardless of which of `amount`,
    `allocation`, or `capitalization` produced it on the synchronous request
    side. Note CB-MOD's Branch B (rate/term-only modification) publishes
    NOTHING here — REQ-CB-MOD-004's no-op means no JournalEntry exists to
    post an event about, consistent with how CB-BOOK also has zero
    gl.entry.posted activity.
  x-epics: [CB-DISB, CB-ACCR, CB-REPAY, CB-DELINQ, CB-PAYOFF, CB-CHARGEOFF, CB-MOD]
  x-req-ids:
    - REQ-CB-DISB-003
    - REQ-CB-DISB-006
    - REQ-CB-DISB-007
    - REQ-CB-ACCR-002
    - REQ-CB-ACCR-003
    - REQ-CB-ACCR-004
    - REQ-CB-ACCR-007
    - REQ-CB-REPAY-003
    - REQ-CB-DELINQ-002
    - REQ-CB-DELINQ-007
    - REQ-CB-DELINQ-008
    - REQ-CB-PAYOFF-004
    - REQ-CB-CHARGEOFF-002
    - REQ-CB-CHARGEOFF-006
    - REQ-CB-CHARGEOFF-008
    - REQ-CB-MOD-003
    - REQ-CB-MOD-004

defaultContentType: application/json

servers:
  production:
    url: events.internal.core-banking.example:9092
    protocol: kafka
    description: Core Banking domain event backbone

channels:
  gl.entry.posted:
    description: >
      Published once, exactly, for every JournalEntry GL posts — regardless of
      which module or posting rule triggered it. For CB-DISB: consumed by
      AccountAPI (to advance disbursement state) and Batch/EOD (REQ-CB-DISB-006
      daily reconciliation feed). For CB-ACCR, CB-REPAY, CB-DELINQ, CB-PAYOFF,
      CB-CHARGEOFF, and CB-MOD's Branch A: consumed by Batch/EOD only —
      AccountAPI observes its own postings synchronously within the same
      request (runDailyAccrual, receiveRepaymentNotification,
      runDailyDelinquencyAssessment, waiveFee, recordChargeOff,
      applyModification), so it does not re-consume this event for those
      postings; Batch/EOD is the only cross-module consumer for that set —
      for CB-CHARGEOFF specifically, filtered to postingRuleCode =
      PR-CHGOFF-01 to compute the running sum GET /gl-accounts/{code}/balance
      is reconciled against.
      x-consumers: [AccountAdapter, BatchEodAdapter]
    publish:
      operationId: publishJournalEntryPosted
      summary: A balanced journal entry has been posted
      message:
        $ref: '#/components/messages/JournalEntryPosted'

  gl.period.closed:
    description: >
      Published once, transactionally, the first time a period is closed
      (not on the idempotent no-op of closing an already-closed period).
      x-consumers: [BatchEodAdapter]
    publish:
      operationId: publishPeriodClosed
      summary: A period was closed
      message:
        $ref: '#/components/messages/PeriodClosed'

components:
  messages:
    JournalEntryPosted:
      name: JournalEntryPosted
      title: Journal Entry Posted
      contentType: application/json
      payload:
        $ref: '../schemas/journal-entry.schema.json#/$defs/JournalEntry'

    PeriodClosed:
      name: PeriodClosed
      title: Period Closed
      contentType: application/json
      payload:
        $ref: '#/components/schemas/PeriodClosedPayload'

  schemas:
    PeriodClosedPayload:
      type: object
      required: [periodId, closedAt, closedBy]
      properties:
        periodId:
          type: string
          pattern: "^[0-9]{4}-(0[1-9]|1[0-2])$"
        closedAt: { type: string, format: date-time }
        closedBy: { type: string }
