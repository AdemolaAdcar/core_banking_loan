asyncapi: 2.6.0
info:
  title: Payment Execution Events
  version: 0.3.0
  description: >
    Domain events published by PaymentAdapter. Retrofitted to the API/Event
    Spec Agent's conventions (v0.3.0, BREAKING from v0.2.0): topics renamed to
    the "<context>.<entity>.<eventPastTense>" convention with no version
    suffix — `payment.executed.v1` → `payment.disbursement.confirmed` (the
    literal example given in the role's own rules) and `payment.failed.v1` →
    `payment.disbursement.failed`; `payment.received.v1` →
    `payment.inbound.received`. The two disbursement-outcome events now use
    the shared PaymentInstruction object (../schemas/payment-instruction.schema.json)
    as their payload — status alone (Executed/Failed) distinguishes them,
    since both are just PaymentInstruction state changes. `payment.inbound.received`
    keeps its own lightweight payload rather than forcing PaymentInstruction's
    shape: at receipt time PayAdapter cannot yet populate `purpose`
    (REPAYMENT vs PAYOFF is AccountAdapter's determination, made inside
    receiveRepaymentNotification, not something PayAdapter knows).
    Also newly documented: `payment.inbound.received` is no longer the
    authoritative trigger for repayment/payoff processing — AccountAPI's
    receiveRepaymentNotification (a synchronous, Idempotency-Key-bearing
    call PayAdapter makes directly) is now that trigger. This event still
    publishes, for other consumers and for audit trail, but a consumer
    relying on it to *drive* processing would be redundant with the
    synchronous path and is no longer the intended integration pattern.
  x-epics: [CB-DISB, CB-REPAY]
  x-req-ids:
    - REQ-CB-DISB-004
    - REQ-CB-DISB-007
    - REQ-CB-REPAY-001

defaultContentType: application/json

servers:
  production:
    url: events.internal.core-banking.example:9092
    protocol: kafka
    description: Core Banking domain event backbone

channels:
  payment.inbound.received:
    description: >
      REQ-CB-REPAY-001. Published whenever PaymentAdapter receives an inbound
      payment from an external rail that is NOT tied to a PayAdapter-initiated
      disbursement. Published for observability/audit only — AccountAdapter
      does not subscribe to this to trigger processing; it processes the same
      payment synchronously via receiveRepaymentNotification instead.
      x-consumers: [BatchEodAdapter]
    publish:
      operationId: publishPaymentInboundReceived
      summary: An inbound payment has been received from a payment rail
      message:
        $ref: '#/components/messages/PaymentInboundReceived'

  payment.disbursement.confirmed:
    description: >
      Published once a submitted disbursement PaymentInstruction is confirmed
      executed by the rail (status = Executed). Consumed by AccountAdapter,
      which transitions the disbursement to "Disbursed" and publishes
      loan.account.disbursed (REQ-CB-DISB-004).
      x-consumers: [AccountAdapter]
    publish:
      operationId: publishPaymentDisbursementConfirmed
      summary: A disbursement payment executed successfully
      message:
        $ref: '#/components/messages/PaymentDisbursementConfirmed'

  payment.disbursement.failed:
    description: >
      Published when a submitted disbursement PaymentInstruction fails or is
      returned by the rail (status = Failed or Returned). Consumed by
      AccountAdapter, which triggers the PR-DISB-02 reversal path (REQ-CB-DISB-007).
      x-consumers: [AccountAdapter]
    publish:
      operationId: publishPaymentDisbursementFailed
      summary: A disbursement payment failed or was returned
      message:
        $ref: '#/components/messages/PaymentDisbursementFailed'

components:
  messages:
    PaymentInboundReceived:
      name: PaymentInboundReceived
      title: Payment Inbound Received
      contentType: application/json
      payload:
        $ref: '#/components/schemas/PaymentInboundReceivedPayload'

    PaymentDisbursementConfirmed:
      name: PaymentDisbursementConfirmed
      title: Payment Disbursement Confirmed
      contentType: application/json
      payload:
        $ref: '../schemas/payment-instruction.schema.json#/$defs/PaymentInstruction'

    PaymentDisbursementFailed:
      name: PaymentDisbursementFailed
      title: Payment Disbursement Failed
      contentType: application/json
      payload:
        $ref: '../schemas/payment-instruction.schema.json#/$defs/PaymentInstruction'

  schemas:
    PaymentInboundReceivedPayload:
      type: object
      required: [paymentReferenceId, amount, rail, receivedAt]
      properties:
        paymentReferenceId:
          type: string
          description: Same value used as the Idempotency-Key on the corresponding receiveRepaymentNotification call.
        loanAccountRef:
          type: ["string", "null"]
        amount:
          $ref: '../schemas/money.schema.json#/$defs/Money'
        rail:
          type: string
        receivedAt:
          type: string
          format: date-time
      description: >
        Deliberately carries reference IDs and rail metadata only — no payer
        bank account or routing details, which stay inside PaymentAdapter's
        own store.
