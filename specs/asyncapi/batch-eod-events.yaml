asyncapi: 2.6.0
info:
  title: Batch/EOD & Reconciliation Events
  version: 0.3.0
  description: >
    Domain events published by BatchEodAdapter. Retrofitted to the API/Event
    Spec Agent's conventions (v0.3.0, BREAKING from v0.2.0): every topic
    renamed to the "<context>.<entity>.<eventPastTense>" convention with no
    version suffix. Also adds CB-PAYOFF's zero-balance completeness exception
    (REQ-CB-PAYOFF-009) in this increment. BatchEodAdapter's role across all
    four epics is a detective control, not a corrective one — these channels
    exist to surface a mismatch, never to trigger an automatic fix; every
    event here is expected to route to a human (Ops/Financial-Reporting), not
    to any of the other five modules programmatically. This is distinct from
    the real-time events in loan-account-subledger-events.yaml
    (payment.match.failed, delinquency.status.changed, loan.nonaccrual.flagged):
    those fire as their respective processing happens; every channel in this
    file is an EOD-close safety net, checking that two independently-derived
    counts agree rather than assuming a single real-time event alone proves
    completeness.
  x-epics: [CB-ACCR, CB-REPAY, CB-DELINQ, CB-PAYOFF]
  x-req-ids:
    - REQ-CB-ACCR-007
    - REQ-CB-REPAY-006
    - REQ-CB-DELINQ-008
    - REQ-CB-PAYOFF-009

defaultContentType: application/json

servers:
  production:
    url: events.internal.core-banking.example:9092
    protocol: kafka
    description: Core Banking domain event backbone

channels:
  accrual.exception.raised:
    description: >
      REQ-CB-ACCR-007. Published by BatchEodAdapter at accrual-batch close for
      a business date when the eligible-account count (from
      GET /loan-accounts:accrual-eligible) does not match the confirmed
      posted-entry count (from gl.entry.posted filtered to postingRuleCode =
      PR-ACCR-01) for that same date. Also raised directly from a non-empty
      `failedAccountIds` list in the AccrualBatchSummary, once every partition
      for the date has reported in.
      x-consumers: []
    publish:
      operationId: publishAccrualExceptionRaised
      summary: Eligible-account count and posted-entry count disagree for a business date
      message:
        $ref: '#/components/messages/AccrualExceptionRaised'

  repayment.exception.raised:
    description: >
      REQ-CB-REPAY-006. Published by BatchEodAdapter at end-of-day for any
      payment received that business date whose Repayment resource is not in
      a terminal state (Posted, Unmatched, or Reversed) by the EOD cutoff.
      x-consumers: []
    publish:
      operationId: publishRepaymentExceptionRaised
      summary: One or more payments received today never reached a terminal state
      message:
        $ref: '#/components/messages/RepaymentExceptionRaised'

  delinquency.exception.raised:
    description: >
      REQ-CB-DELINQ-008. Published by BatchEodAdapter at delinquency-batch
      close for a business date when fee assessments and DPD-bucket changes
      disagree in either direction.
      x-consumers: []
    publish:
      operationId: publishDelinquencyExceptionRaised
      summary: Fee assessments and DPD-bucket changes disagree for a business date
      message:
        $ref: '#/components/messages/DelinquencyExceptionRaised'

  payoff.exception.raised:
    description: >
      REQ-CB-PAYOFF-009. Published by BatchEodAdapter at end-of-day for any
      loan account transitioned to "Closed" via payoff that business date
      whose principal and accrued-interest balances are not confirmed exactly
      zero.
      x-consumers: []
    publish:
      operationId: publishPayoffExceptionRaised
      summary: A loan account closed via payoff today has a non-zero residual balance
      message:
        $ref: '#/components/messages/PayoffExceptionRaised'

components:
  messages:
    AccrualExceptionRaised:
      name: AccrualExceptionRaised
      title: Accrual Exception Raised
      contentType: application/json
      payload:
        $ref: '#/components/schemas/AccrualExceptionRaisedPayload'

    RepaymentExceptionRaised:
      name: RepaymentExceptionRaised
      title: Repayment Exception Raised
      contentType: application/json
      payload:
        $ref: '#/components/schemas/RepaymentExceptionRaisedPayload'

    DelinquencyExceptionRaised:
      name: DelinquencyExceptionRaised
      title: Delinquency Exception Raised
      contentType: application/json
      payload:
        $ref: '#/components/schemas/DelinquencyExceptionRaisedPayload'

    PayoffExceptionRaised:
      name: PayoffExceptionRaised
      title: Payoff Exception Raised
      contentType: application/json
      payload:
        $ref: '#/components/schemas/PayoffExceptionRaisedPayload'

  schemas:
    AccrualExceptionRaisedPayload:
      type: object
      required: [businessDate, eligibleAccountCount, postedEntryCount, missingAccountIds, raisedAt]
      properties:
        businessDate: { type: string, format: date }
        eligibleAccountCount: { type: integer }
        postedEntryCount: { type: integer }
        missingAccountIds:
          type: array
          items: { type: string, format: uuid }
        unexpectedAccountIds:
          type: array
          items: { type: string, format: uuid }
          description: >
            Should be structurally impossible given GL only posts what
            AccountAPI requests, but modeled here so the completeness check
            can prove that invariant rather than assume it.
        raisedAt: { type: string, format: date-time }

    DelinquencyExceptionRaisedPayload:
      type: object
      required: [businessDate, newlyPastDueCount, feesAssessedCount, accountsMissingFee, raisedAt]
      properties:
        businessDate: { type: string, format: date }
        newlyPastDueCount: { type: integer }
        feesAssessedCount: { type: integer }
        accountsMissingFee:
          type: array
          items: { type: string, format: uuid }
        feesWithoutPastDueAccount:
          type: array
          items: { type: string, format: uuid }
        raisedAt: { type: string, format: date-time }

    RepaymentExceptionRaisedPayload:
      type: object
      required: [businessDate, unresolvedRepaymentIds, raisedAt]
      properties:
        businessDate: { type: string, format: date }
        unresolvedRepaymentIds:
          type: array
          items: { type: string }
        raisedAt: { type: string, format: date-time }

    PayoffExceptionRaisedPayload:
      type: object
      required: [businessDate, closedAccountsWithResidualBalance, raisedAt]
      properties:
        businessDate: { type: string, format: date }
        closedAccountsWithResidualBalance:
          type: array
          items:
            type: object
            required: [loanAccountId, payoffId, residualAmount]
            properties:
              loanAccountId: { type: string, format: uuid }
              payoffId: { type: string }
              residualAmount: { $ref: '../schemas/money.schema.json#/$defs/Money' }
        raisedAt: { type: string, format: date-time }
